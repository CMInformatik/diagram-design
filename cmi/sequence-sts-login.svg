<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sequence-sts-login-title sequence-sts-login-desc">
      <title id="sequence-sts-login-title">Login über STS in den WebClient</title>
      <desc id="sequence-sts-login-desc">Der WebClient leitet den Benutzer zum STS weiter, der STS prüft die Anmeldung und gibt per Code-Austausch die Tokens aus, mit denen der WebClient anschliessend die Backend-API aufruft.</desc>
      <defs>
        <style>@import url('https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,400;0,700;1,400&amp;family=Roboto+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4a6272"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#009fe3"/>
        </marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#1a808c"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#f7f9fa"/>

      <!-- LIFELINES — Benutzer 112 · WebClient 336 · STS 560 · API 784 -->
      <line x1="112" y1="128" x2="112" y2="672" stroke="#1d3849" stroke-opacity="0.22" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="336" y1="128" x2="336" y2="672" stroke="#1d3849" stroke-opacity="0.22" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="560" y1="128" x2="560" y2="672" stroke="#1d3849" stroke-opacity="0.22" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="784" y1="128" x2="784" y2="672" stroke="#1d3849" stroke-opacity="0.22" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- ACTIVATION BARS -->
      <rect x="332" y="176" width="8" height="48" fill="#1d3849" fill-opacity="0.06" stroke="#4a6272" stroke-width="0.8"/>
      <rect x="332" y="392" width="8" height="256" fill="#1d3849" fill-opacity="0.06" stroke="#4a6272" stroke-width="0.8"/>
      <rect x="556" y="216" width="8" height="48" fill="#1d3849" fill-opacity="0.06" stroke="#4a6272" stroke-width="0.8"/>
      <rect x="556" y="296" width="8" height="104" fill="#1d3849" fill-opacity="0.06" stroke="#4a6272" stroke-width="0.8"/>
      <rect x="556" y="432" width="8" height="48" fill="#1d3849" fill-opacity="0.06" stroke="#4a6272" stroke-width="0.8"/>
      <rect x="780" y="512" width="8" height="96" fill="#1d3849" fill-opacity="0.06" stroke="#4a6272" stroke-width="0.8"/>

      <!-- M1: Benutzer → WebClient -->
      <line x1="112" y1="176" x2="332" y2="176" stroke="#4a6272" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="188" y="156" width="72" height="12" rx="2" fill="#f7f9fa"/>
      <text x="224" y="165" fill="#4a6272" font-size="8" font-family="'Roboto Mono', monospace" text-anchor="middle" letter-spacing="0.06em">APP ÖFFNEN</text>

      <!-- M2: WebClient → STS  Redirect auf /authorize (mit PKCE-Challenge) -->
      <line x1="340" y1="216" x2="556" y2="216" stroke="#1a808c" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="400" y="196" width="96" height="12" rx="2" fill="#f7f9fa"/>
      <text x="448" y="205" fill="#1a808c" font-size="8" font-family="'Roboto Mono', monospace" text-anchor="middle" letter-spacing="0.06em">GET /AUTHORIZE</text>

      <!-- M3: STS → Benutzer  Login-Maske -->
      <line x1="556" y1="256" x2="116" y2="256" stroke="#4a6272" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="184" y="236" width="80" height="12" rx="2" fill="#f7f9fa"/>
      <text x="224" y="245" fill="#4a6272" font-size="8" font-family="'Roboto Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LOGIN-MASKE</text>

      <!-- M4: Benutzer → STS  Anmeldedaten -->
      <line x1="112" y1="296" x2="556" y2="296" stroke="#1a808c" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="184" y="276" width="80" height="12" rx="2" fill="#f7f9fa"/>
      <text x="224" y="285" fill="#1a808c" font-size="8" font-family="'Roboto Mono', monospace" text-anchor="middle" letter-spacing="0.06em">POST /LOGIN</text>

      <!-- M5: STS self — Anmeldung prüfen -->
      <path d="M564 328 H588 Q596 328 596 336 V344 Q596 352 588 352 H568" fill="none" stroke="#4a6272" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="604" y="334" width="80" height="12" rx="2" fill="#f7f9fa"/>
      <text x="608" y="343" fill="#4a6272" font-size="8" font-family="'Roboto Mono', monospace" letter-spacing="0.06em">LOGIN PRÜFEN</text>

      <!-- M6: STS → WebClient  Redirect mit Authorization Code -->
      <line x1="556" y1="392" x2="340" y2="392" stroke="#4a6272" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="404" y="372" width="88" height="12" rx="2" fill="#f7f9fa"/>
      <text x="448" y="381" fill="#4a6272" font-size="8" font-family="'Roboto Mono', monospace" text-anchor="middle" letter-spacing="0.06em">302 · ?CODE=</text>

      <!-- M7: WebClient → STS  Code gegen Tokens tauschen -->
      <line x1="340" y1="432" x2="556" y2="432" stroke="#1a808c" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="408" y="412" width="80" height="12" rx="2" fill="#f7f9fa"/>
      <text x="448" y="421" fill="#1a808c" font-size="8" font-family="'Roboto Mono', monospace" text-anchor="middle" letter-spacing="0.06em">POST /TOKEN</text>

      <!-- M8: STS → WebClient  Tokens (Headline) -->
      <line x1="556" y1="472" x2="340" y2="472" stroke="#009fe3" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <rect x="404" y="452" width="88" height="12" rx="2" fill="#f7f9fa"/>
      <text x="448" y="461" fill="#1d3849" font-size="8" font-family="'Roboto Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TOKENS · JWT</text>

      <!-- M9: WebClient → API  Aufruf mit Bearer-Token -->
      <line x1="340" y1="512" x2="780" y2="512" stroke="#1a808c" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="628" y="492" width="88" height="12" rx="2" fill="#f7f9fa"/>
      <text x="672" y="501" fill="#1a808c" font-size="8" font-family="'Roboto Mono', monospace" text-anchor="middle" letter-spacing="0.06em">API · BEARER</text>

      <!-- M10: API self — JWT prüfen -->
      <path d="M788 544 H812 Q820 544 820 552 V560 Q820 568 812 568 H792" fill="none" stroke="#4a6272" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="828" y="550" width="72" height="12" rx="2" fill="#f7f9fa"/>
      <text x="832" y="559" fill="#4a6272" font-size="8" font-family="'Roboto Mono', monospace" letter-spacing="0.06em">JWT PRÜFEN</text>

      <!-- M11: API → WebClient  Daten -->
      <line x1="780" y1="600" x2="340" y2="600" stroke="#4a6272" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="632" y="580" width="80" height="12" rx="2" fill="#f7f9fa"/>
      <text x="672" y="589" fill="#4a6272" font-size="8" font-family="'Roboto Mono', monospace" text-anchor="middle" letter-spacing="0.06em">200 · DATEN</text>

      <!-- M12: WebClient → Benutzer  angemeldet -->
      <line x1="332" y1="640" x2="116" y2="640" stroke="#4a6272" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="180" y="620" width="88" height="12" rx="2" fill="#f7f9fa"/>
      <text x="224" y="629" fill="#4a6272" font-size="8" font-family="'Roboto Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ANGEMELDET</text>

      <!-- ACTOR BOXES — drawn after arrows -->
      <!-- Benutzer (input) -->
      <rect x="40" y="72" width="144" height="56" rx="6" fill="#f7f9fa"/>
      <rect x="40" y="72" width="144" height="56" rx="6" fill="#4a6272" fill-opacity="0.10" stroke="#7a8e9b" stroke-width="1"/>
      <rect x="48" y="80" width="32" height="12" rx="2" fill="none" stroke="#7a8e9b" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="64" y="89" fill="#4a6272" font-size="7" font-family="'Roboto Mono', monospace" text-anchor="middle" letter-spacing="0.08em">USER</text>
      <text x="112" y="104" fill="#1d3849" font-size="12" font-weight="700" font-family="'Arial', 'Arimo', sans-serif" text-anchor="middle">Benutzer</text>
      <text x="112" y="119" fill="#4a6272" font-size="9" font-family="'Roboto Mono', monospace" text-anchor="middle">Browser</text>

      <!-- WebClient (backend) -->
      <rect x="264" y="72" width="144" height="56" rx="6" fill="#f7f9fa"/>
      <rect x="264" y="72" width="144" height="56" rx="6" fill="#ffffff" stroke="#1d3849" stroke-width="1"/>
      <rect x="272" y="80" width="28" height="12" rx="2" fill="none" stroke="#1d3849" stroke-opacity="0.30" stroke-width="0.8"/>
      <text x="286" y="89" fill="#4a6272" font-size="7" font-family="'Roboto Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SPA</text>
      <text x="336" y="104" fill="#1d3849" font-size="12" font-weight="700" font-family="'Arial', 'Arimo', sans-serif" text-anchor="middle">WebClient</text>
      <text x="336" y="119" fill="#4a6272" font-size="9" font-family="'Roboto Mono', monospace" text-anchor="middle">OIDC-Client · PKCE</text>

      <!-- STS (focal) -->
      <rect x="488" y="72" width="144" height="56" rx="6" fill="#f7f9fa"/>
      <rect x="488" y="72" width="144" height="56" rx="6" fill="#dff2fd" stroke="#009fe3" stroke-width="1"/>
      <rect x="496" y="80" width="28" height="12" rx="2" fill="none" stroke="#009fe3" stroke-opacity="0.50" stroke-width="0.8"/>
      <text x="510" y="89" fill="#1d3849" font-size="7" font-family="'Roboto Mono', monospace" text-anchor="middle" letter-spacing="0.08em">IDP</text>
      <text x="560" y="104" fill="#1d3849" font-size="12" font-weight="700" font-family="'Arial', 'Arimo', sans-serif" text-anchor="middle">STS</text>
      <text x="560" y="119" fill="#4a6272" font-size="9" font-family="'Roboto Mono', monospace" text-anchor="middle">OpenID Connect</text>

      <!-- Backend API (backend) -->
      <rect x="712" y="72" width="144" height="56" rx="6" fill="#f7f9fa"/>
      <rect x="712" y="72" width="144" height="56" rx="6" fill="#ffffff" stroke="#1d3849" stroke-width="1"/>
      <rect x="720" y="80" width="28" height="12" rx="2" fill="none" stroke="#1d3849" stroke-opacity="0.30" stroke-width="0.8"/>
      <text x="734" y="89" fill="#4a6272" font-size="7" font-family="'Roboto Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
      <text x="784" y="104" fill="#1d3849" font-size="12" font-weight="700" font-family="'Arial', 'Arimo', sans-serif" text-anchor="middle">Backend-API</text>
      <text x="784" y="119" fill="#4a6272" font-size="9" font-family="'Roboto Mono', monospace" text-anchor="middle">Bearer-Prüfung</text>

      <!-- LEGEND -->
      <line x1="40" y1="696" x2="920" y2="696" stroke="#1d3849" stroke-opacity="0.10" stroke-width="0.8"/>
      <text x="40" y="712" fill="#4a6272" font-size="8" font-family="'Roboto Mono', monospace" letter-spacing="0.18em">LEGENDE</text>

      <rect x="40" y="728" width="14" height="10" rx="2" fill="#dff2fd" stroke="#009fe3" stroke-width="1"/>
      <text x="60" y="736" fill="#4a6272" font-size="8.5" font-family="'Arial', 'Arimo', sans-serif">Identity Provider</text>

      <line x1="200" y1="732" x2="228" y2="732" stroke="#1a808c" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="236" y="736" fill="#4a6272" font-size="8.5" font-family="'Arial', 'Arimo', sans-serif">HTTP-Aufruf</text>

      <line x1="344" y1="732" x2="372" y2="732" stroke="#4a6272" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="380" y="736" fill="#4a6272" font-size="8.5" font-family="'Arial', 'Arimo', sans-serif">Antwort / Redirect</text>

      <line x1="512" y1="732" x2="540" y2="732" stroke="#4a6272" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="548" y="736" fill="#4a6272" font-size="8.5" font-family="'Arial', 'Arimo', sans-serif">Interne Prüfung / Aktion</text>

      <line x1="704" y1="732" x2="732" y2="732" stroke="#009fe3" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="740" y="736" fill="#4a6272" font-size="8.5" font-family="'Arial', 'Arimo', sans-serif">Token-Ausgabe</text>
    </svg>
