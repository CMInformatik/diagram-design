<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="swimlane-sitzungsvorbereitung-title swimlane-sitzungsvorbereitung-desc">
      <title id="swimlane-sitzungsvorbereitung-title">Sitzungsvorbereitung</title>
      <desc id="swimlane-sitzungsvorbereitung-desc">Das Sekretariat erfasst die Traktanden und entwirft die Traktandenliste, das Präsidium gibt sie frei oder verlangt Änderungen, danach versendet das Sekretariat die Einladung und das Gremium bereitet sich mit den Unterlagen vor.</desc>
      <defs>
        <style>@import url('https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,400;0,700;1,400&amp;family=Roboto+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4a6272"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#009fe3"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f7f9fa"/>

      <!-- Lane dividers — Sekretariat 80–176 · Präsidium 176–272 · Gremium 272–368 -->
      <line x1="40" y1="80" x2="920" y2="80" stroke="#1d3849" stroke-opacity="0.22" stroke-width="1"/>
      <line x1="40" y1="176" x2="920" y2="176" stroke="#1d3849" stroke-opacity="0.10" stroke-width="1"/>
      <line x1="40" y1="272" x2="920" y2="272" stroke="#1d3849" stroke-opacity="0.10" stroke-width="1"/>
      <line x1="40" y1="368" x2="920" y2="368" stroke="#1d3849" stroke-opacity="0.22" stroke-width="1"/>

      <!-- Actor column divider -->
      <line x1="160" y1="80" x2="160" y2="368" stroke="#1d3849" stroke-opacity="0.22" stroke-width="1"/>

      <!-- Lane labels -->
      <text x="52" y="132" fill="#4a6272" font-size="9" font-family="'Roboto Mono', monospace" letter-spacing="0.18em">SEKRETARIAT</text>
      <text x="52" y="228" fill="#4a6272" font-size="9" font-family="'Roboto Mono', monospace" letter-spacing="0.18em">PRÄSIDIUM</text>
      <text x="52" y="324" fill="#4a6272" font-size="9" font-family="'Roboto Mono', monospace" letter-spacing="0.18em">GREMIUM</text>

      <!-- Arrows (drawn first) -->
      <!-- 1. Traktanden erfassen → Traktandenliste (within Sekretariat) -->
      <line x1="312" y1="128" x2="336" y2="128" stroke="#4a6272" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- 2. Traktandenliste → Freigabe (Sekretariat → Präsidium) -->
      <path d="M400 152 V216 Q400 224 408 224 H488" fill="none" stroke="#4a6272" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- 3. Freigabe → Traktandenliste (revision loop) -->
      <path d="M520 200 V144 Q520 136 512 136 H464" fill="none" stroke="#4a6272" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <!-- 4. Freigabe → Einladung (Präsidium → Sekretariat) -->
      <path d="M616 224 H696 Q704 224 704 216 V152" fill="none" stroke="#4a6272" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- 5. Einladung → Vorbereitung (Sekretariat → Gremium, focal handoff) -->
      <path d="M768 128 H848 Q856 128 856 136 V296" fill="none" stroke="#009fe3" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- Arrow labels -->
      <rect x="308" y="182" width="84" height="12" rx="2" fill="#f7f9fa"/>
      <text x="350" y="191" fill="#4a6272" font-size="8" font-family="'Roboto Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ZUR FREIGABE</text>

      <rect x="528" y="160" width="72" height="12" rx="2" fill="#f7f9fa"/>
      <text x="564" y="169" fill="#4a6272" font-size="8" font-family="'Roboto Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ÄNDERUNGEN</text>

      <rect x="628" y="232" width="68" height="12" rx="2" fill="#f7f9fa"/>
      <text x="662" y="241" fill="#4a6272" font-size="8" font-family="'Roboto Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FREIGEGEBEN</text>

      <rect x="776" y="216" width="72" height="12" rx="2" fill="#f7f9fa"/>
      <text x="812" y="225" fill="#1d3849" font-size="8" font-family="'Roboto Mono', monospace" text-anchor="middle" letter-spacing="0.06em">EINLADUNG</text>

      <!-- Steps -->
      <!-- Sekretariat: Traktanden erfassen -->
      <rect x="184" y="104" width="128" height="48" rx="6" fill="#ffffff" stroke="#1d3849" stroke-width="1"/>
      <text x="248" y="125" fill="#1d3849" font-size="11" font-weight="700" font-family="'Arial', 'Arimo', sans-serif" text-anchor="middle">Traktanden erfassen</text>
      <text x="248" y="139" fill="#4a6272" font-size="8" font-family="'Roboto Mono', monospace" text-anchor="middle">Geschäfte · Anträge</text>

      <!-- Sekretariat: Traktandenliste entwerfen -->
      <rect x="336" y="104" width="128" height="48" rx="6" fill="#ffffff" stroke="#1d3849" stroke-width="1"/>
      <text x="400" y="125" fill="#1d3849" font-size="11" font-weight="700" font-family="'Arial', 'Arimo', sans-serif" text-anchor="middle">Traktandenliste</text>
      <text x="400" y="139" fill="#4a6272" font-size="8" font-family="'Roboto Mono', monospace" text-anchor="middle">Entwurf</text>

      <!-- Präsidium: Freigabe (focal) -->
      <rect x="488" y="200" width="128" height="48" rx="6" fill="#dff2fd" stroke="#009fe3" stroke-width="1"/>
      <text x="552" y="221" fill="#1d3849" font-size="11" font-weight="700" font-family="'Arial', 'Arimo', sans-serif" text-anchor="middle">Freigabe</text>
      <text x="552" y="235" fill="#4a6272" font-size="8" font-family="'Roboto Mono', monospace" text-anchor="middle">Traktandenliste</text>

      <!-- Sekretariat: Einladung versenden -->
      <rect x="640" y="104" width="128" height="48" rx="6" fill="#ffffff" stroke="#1d3849" stroke-width="1"/>
      <text x="704" y="125" fill="#1d3849" font-size="11" font-weight="700" font-family="'Arial', 'Arimo', sans-serif" text-anchor="middle">Einladung</text>
      <text x="704" y="139" fill="#4a6272" font-size="8" font-family="'Roboto Mono', monospace" text-anchor="middle">Unterlagen · Versand</text>

      <!-- Gremium: Vorbereitung -->
      <rect x="792" y="296" width="128" height="48" rx="6" fill="#ffffff" stroke="#1d3849" stroke-width="1"/>
      <text x="856" y="317" fill="#1d3849" font-size="11" font-weight="700" font-family="'Arial', 'Arimo', sans-serif" text-anchor="middle">Vorbereitung</text>
      <text x="856" y="331" fill="#4a6272" font-size="8" font-family="'Roboto Mono', monospace" text-anchor="middle">Unterlagen studieren</text>

      <!-- Legend -->
      <line x1="40" y1="396" x2="920" y2="396" stroke="#1d3849" stroke-opacity="0.10" stroke-width="0.8"/>
      <text x="40" y="412" fill="#4a6272" font-size="8" font-family="'Roboto Mono', monospace" letter-spacing="0.18em">LEGENDE</text>

      <rect x="40" y="428" width="14" height="10" rx="2" fill="#ffffff" stroke="#1d3849" stroke-width="1"/>
      <text x="60" y="436" fill="#4a6272" font-size="8.5" font-family="'Arial', 'Arimo', sans-serif">Arbeitsschritt</text>

      <rect x="160" y="428" width="14" height="10" rx="2" fill="#dff2fd" stroke="#009fe3" stroke-width="1"/>
      <text x="180" y="436" fill="#4a6272" font-size="8.5" font-family="'Arial', 'Arimo', sans-serif">Entscheid</text>

      <line x1="272" y1="433" x2="300" y2="433" stroke="#4a6272" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="308" y="436" fill="#4a6272" font-size="8.5" font-family="'Arial', 'Arimo', sans-serif">Ablauf / Übergabe</text>

      <line x1="432" y1="433" x2="460" y2="433" stroke="#4a6272" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="468" y="436" fill="#4a6272" font-size="8.5" font-family="'Arial', 'Arimo', sans-serif">Überarbeitung</text>

      <line x1="572" y1="433" x2="600" y2="433" stroke="#009fe3" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="608" y="436" fill="#4a6272" font-size="8.5" font-family="'Arial', 'Arimo', sans-serif">Zentrale Übergabe</text>
    </svg>
